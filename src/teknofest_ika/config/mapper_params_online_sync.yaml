slam_toolbox:
  ros__parameters:

    # ── Çözücü (Ceres Solver) ─────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Frame tanımları ───────────────────────────────────────────────
    # base_frame: base_footprint — EKF'nin yayınladığı TF ile eşleşmeli
    #   EKF → odom → base_footprint (child_frame_id)
    #   RSP → base_footprint → base_link → lidar_link
    # base_link YAZMA — EKF odom→base_footprint yayınlıyor, çakışır
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # ── TF / Mesaj filtresi ───────────────────────────────────────────
    # transform_timeout: 0.5 s
    #   Bir tarama geldiğinde TF lookup için bekleme süresi.
    #   0.2'de WSL+Gazebo yükünde lookup zaman aşımına uğruyor.
    #   0.5 ile EKF 30 Hz → her ~33 ms bir TF, 0.5 s içinde ~15 kayıt birikir.
    #
    # tf_buffer_duration: 30.0 s
    #   slam_toolbox'ın iç TF tampon penceresi.
    #   Varsayılan 5.0 s — kısa tampon, eski taramalar için lookup başarısız oluyor.
    #
    # message_filter_queue_size: 50
    #   Lidar 10 Hz → async node işleme beklerken biriken tarama sayısı.
    #   20 yetmiyordu (queue full hatası), 50 ile 5 saniyelik birikim tamponlanır.
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    message_filter_queue_size: 50

    # ── Harita parametreleri ──────────────────────────────────────────
    map_update_interval: 5.0       # Harita güncelleme periyodu [s]
    resolution: 0.05               # Hücre boyutu [m/hücre]
    max_laser_range: 12.0          # YDLidar Tmini Pro maks. mesafe [m]
    minimum_time_interval: 0.5     # İki tarama arasındaki minimum süre [s] → 2 Hz max
    transform_publish_period: 0.02 # map→odom TF yayın periyodu [s] → 50 Hz

    # ── Döngü kapatma (Loop Closure) ─────────────────────────────────
    # Grafik tabanlı optimizasyon: Ceres ile g2o-style pose graph.
    # loop_search_distance: Mevcut pozisyondan kaç metre çevrede arama yapılır.
    # Küçük park yeri haritası için 1.5 m yeterli.
    do_loop_closing: true
    loop_search_distance: 1.5
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Tarama eşleştirme (Scan Matching) ────────────────────────────
    # Correlative scan matching parametreleri.
    # distance_variance_penalty: Önerilen hareketin uzaklık belirsizliği cezası.
    # angle_variance_penalty: Açısal belirsizlik cezası.
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349    # ~0.2° ince arama aralığı
    coarse_search_angle_offset: 0.349    # ~20° kaba arama aralığı
    coarse_angle_resolution: 0.0349      # ~2° kaba arama adımı
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
