### nav2_params.yaml — LYDİA Nav2 Konfigürasyonu (v2.0)
#
# Araç: Ackermann kinematikli İKA
#   Dingil arası (L)    : ~0.55 m  ← PLACEHOLDER, araç hazır olunca ölç
#   İz genişliği        : ~0.67 m  ← PLACEHOLDER
#   Robot yarıçapı      : ~0.40 m  (konservatif güvenli değer)
#   Max hız             : 3.0 m/s  (VESC sınırı)
#   Max direksiyon açısı: ~30°     ← gerçek araçta ölçülecek
#   Min dönüş yarıçapı  : L / tan(δ_max) = 0.55 / tan(30°) ≈ 0.95 m
#
# Planner   : SmacPlannerHybrid (Reeds-Shepp — Ackermann uyumlu)
# Controller: RegulatedPurePursuitController (RPP — Ackermann uyumlu)
#
# ─── RPP DAR KORİDOR ANALİZİ ──────────────────────────────────────────
# Teknofest parkurunda beklenen koridor genişliği ~1.5–2.0 m arası.
#
# Inflation analizi (koridor = 1.5m, robot_radius = 0.40m):
#   Clearance per side = (1.5 - 0.80) / 2 = 0.35 m
#   inflation_radius = 0.45 m → robot maliyet bölgesine girer → RPP yavaşlar
#   inflation_radius > 0.75m → planner koridor içinde yol bulamaz!
#   Seçilen değer: 0.45 m (dar koridor geçişine izin verir, duvar yakınında frenler)
#
# RPP cost-regulated velocity scaling:
#   Costmap maliyeti yüksek (duvar yakını) → RPP hızı otomatik kısar
#   use_cost_regulated_linear_velocity_scaling: true (aktif)
#   cost_scaling_gain: 1.0 → lineer azaltma
#
# Ackermann için KRİTİK: use_rotate_to_heading: FALSE
#   Ackermann yerinde dönemez. Bu parametre true olursa Nav2 araç
#   bir noktada durup yerinde döndürmeye çalışır — mekanik imkansız.
#
# SmacPlannerHybrid minimum_turning_radius:
#   regulated_linear_scaling_min_radius >= minimum_turning_radius şartı:
#   1.0 >= 0.95 ✓ (RPP dar virajlarda hız kısar, plan geometriyle uyumlu)
#
# KURULUM:
#   sudo apt install ros-humble-nav2-bringup ros-humble-nav2-smac-planner
#
# TUNING NOTU:
#   Gerçek araç ölçüleri alındıktan sonra minimum_turning_radius güncelle:
#   minimum_turning_radius = dingil_arasi / tan(max_direksiyon_radyan)

# ─────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered    # EKF çıkışı
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

# ─── Kontrolcü (Yerel Planlayıcı) ────────────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      lookahead_dist: 1.5
      min_lookahead_dist: 0.8
      max_lookahead_dist: 3.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.25
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      max_angular_vel: 1.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: false
      use_rotate_to_heading: false     # KRİTİK: Ackermann yerinde dönemez!

# ─── Global Planlayıcı ───────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.95
      reverse_penalty: 5.0
      change_penalty: 0.1
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_reverse_expansion: false

# ─── Smoother ────────────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ─── Behavior Server ─────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait", "spin"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    spin:
      plugin: "nav2_behaviors/Spin"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ─── Global Costmap ───────────────────────────────────────────────────────────
# Sadece 2D LiDAR (/scan) — haritalama ve global planlama için yeterli.
# OS30A buraya eklenmez: global harita statik, 3D nokta bulutu gereksiz yük.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.40
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.1
          obstacle_max_range: 7.5
          obstacle_min_range: 0.25

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45   # Dar koridor analizi: 0.55 → 0.45 (koridor=1.5m, clearance=0.35m/side)

      always_send_full_costmap: true

# ─── Lokal Costmap ────────────────────────────────────────────────────────────
# İki gözlem kaynağı: Tmini Pro 2D (/scan) + OS30A 3D (/os30a/points)
#
# Mimari gerekçe (heterogeneous sensor fusion):
#   /scan      → hızlı, hafif, yatay düzlemdeki engeller
#   /os30a     → min_obstacle_height=0.05 ile zemin gürültüsü filtrelenir
#                max_obstacle_height=1.80 ile araç gövdesi üstü atlanır
#                Bordür, taş, sarkan dal gibi 2D'nin kaçırdığı engeller
#                local costmap'e işlenir — daha güvenli yerel navigasyon
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.40
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan pointcloud

        # ── Kaynak 1: YDLidar Tmini Pro (2D LaserScan) ───────────────────
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 5.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.5
          obstacle_min_range: 0.25

        # ── Kaynak 2: YDLidar OS30A (3D PointCloud2) ─────────────────────
        pointcloud:
          topic: /os30a/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.05   # zemin yansıması + gürültü filtresi [m]
          max_obstacle_height: 1.80   # araç gövdesi üstündeki nesneleri atla [m]
          clearing: true
          marking: true
          raytrace_max_range: 5.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.5
          obstacle_min_range: 0.25

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45   # Dar koridor analizi: 0.55 → 0.45

      always_send_full_costmap: true

# ─── AMCL (Lokalizasyon) — SLAM_Toolbox aktifse kullanılmaz ──────────────────
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel  # Ackermann ≈ differential (yerinde dönmez)
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    map_topic: /map

# ─── Map Server ───────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ─── Lifecycle Manager ────────────────────────────────────────────────────────
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
