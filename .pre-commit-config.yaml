# LYDIA IKA -- Pre-commit hooks
# Kurulum: pip install pre-commit && pre-commit install
# Calistirma: pre-commit run --all-files

repos:
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=120
          - --max-complexity=15
          - --select=E9,F63,F7,F82,W291,W292,W293
        files: ^(teknofest_ika|scripts|test)/
        exclude: ^(models|maps|urdf|worlds|meshes|materials)/

  - repo: https://github.com/psf/black
    rev: 24.4.0
    hooks:
      - id: black
        language_version: python3
        files: ^(teknofest_ika|scripts|test)/
        exclude: ^(models|maps|urdf|worlds|meshes|materials)/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^(teknofest_ika|scripts|test)/
        exclude: ^(models|maps|urdf|worlds|meshes|materials)/
